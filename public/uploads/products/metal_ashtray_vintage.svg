<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="ashtrayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5C4018" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <filter id="trayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#080808"/>
  <circle cx="400" cy="400" r="360" fill="url(#ashtrayGlow)"/>

  <text x="400" y="90" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="900" fill="#E5C158" text-anchor="middle" letter-spacing="3">CAST ANTIQUE BRASS ASHTRAY</text>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A89050" text-anchor="middle" letter-spacing="2">SOLID METAL PUSH-DOWN SPINNING MECHANISM</text>

  <!-- Ashtray Isometric Shape -->
  <g filter="url(#trayShadow)" transform="translate(0, 40)">
    <!-- Outer Rim -->
    <ellipse cx="400" cy="420" rx="260" ry="160" fill="#5C4018" stroke="#F3D079" stroke-width="4"/>
    
    <!-- Inner Bowl -->
    <ellipse cx="400" cy="420" rx="190" ry="110" fill="#151515" stroke="#F3D079" stroke-width="2"/>
    
    
      <!-- Spinning Metal Plunger & Disc -->
      <circle cx="400" cy="420" r="60" fill="#888" stroke="#fff" stroke-width="2"/>
      <rect x="390" y="270" width="20" height="150" rx="6" fill="#aaa" stroke="#444" stroke-width="2"/>
      <circle cx="400" cy="265" r="22" fill="#D4AF37" stroke="#fff" stroke-width="2"/>
    

    <!-- Cigarette / Cigar Rests -->
    <rect x="135" y="412" width="40" height="16" rx="6" fill="#111" stroke="#F3D079" stroke-width="2"/>
    <rect x="625" y="412" width="40" height="16" rx="6" fill="#111" stroke="#F3D079" stroke-width="2"/>
    <rect x="392" y="255" width="16" height="40" rx="6" fill="#111" stroke="#F3D079" stroke-width="2"/>
    <rect x="392" y="545" width="16" height="40" rx="6" fill="#111" stroke="#F3D079" stroke-width="2"/>
  </g>
</svg>