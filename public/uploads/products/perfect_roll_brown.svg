<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="paperBooklet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="50%" stop-color="#6E451F"/>
      <stop offset="100%" stop-color="#4A2E14"/>
    </linearGradient>
    <filter id="bookletShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#0A0A0A"/>
  <circle cx="400" cy="400" r="350" fill="#402510" opacity="0.4"/>

  <!-- Booklet Perspective Pack -->
  <g filter="url(#bookletShadow)" transform="translate(0, 20)">
    <!-- Main Booklet Body (King Size Slim format) -->
    <rect x="150" y="240" width="500" height="280" rx="16" fill="url(#paperBooklet)" stroke="#D4AF37" stroke-width="3"/>
    
    <!-- Top Flap Fold Crease -->
    <line x1="150" y1="330" x2="650" y2="330" stroke="#000" stroke-width="2" opacity="0.4"/>
    
    <!-- Brand Title -->
    <text x="400" y="300" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="900" fill="#F7D070" text-anchor="middle" letter-spacing="3">PERFECT ROLL</text>
    
    <!-- Paper Type Spec -->
    <rect x="200" y="360" width="400" height="50" rx="8" fill="#111" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="400" y="392" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BROWN PRE-ROLLED CONES</text>
    
    <!-- Roach Tips & Specs -->
    <text x="400" y="445" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFE4B5" text-anchor="middle" letter-spacing="1">32 LEAVES + 32 ROACH TIPS &bull; ULTRA THIN</text>
    <text x="400" y="480" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="2">PACK OF 3 PRE-ROLLED CONES &bull; SLOW BURNING</text>

    <!-- Hologram / Authentic Seal -->
    <circle cx="590" cy="285" r="28" fill="#D4AF37" stroke="#fff" stroke-width="1"/>
    <text x="590" y="290" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#000" text-anchor="middle">ORIGINAL</text>
  </g>

  <!-- Pre-rolled cones illustration below -->
  <g transform="translate(180, 580)">
    <path d="M 50 40 L 400 20 L 400 60 L 50 40 Z" fill="#A06D3B" stroke="#333" stroke-width="1"/>
    <ellipse cx="400" cy="40" rx="10" ry="20" fill="#704214"/>
    <rect x="50" y="32" width="60" height="16" fill="#D2B48C" stroke="#8B5A2B"/>
    <text x="220" y="45" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#222">PERFECT CONE</text>
  </g>
</svg>