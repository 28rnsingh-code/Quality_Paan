<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bongGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#99e2b4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bongBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99e2b4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#99e2b4" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="bongShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#080808"/>
  <circle cx="400" cy="400" r="360" fill="url(#bongGlow)"/>
  
  <text x="400" y="70" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="900" fill="#E5C158" text-anchor="middle" letter-spacing="3">MATRIX SHOWERHEAD PERC ICE BONG</text>
  <text x="400" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A89050" text-anchor="middle" letter-spacing="2">BOROSILICATE GLASS PERCOLATOR</text>

  <g filter="url(#bongShadow)" transform="translate(0, 20)">
    <!-- Mouthpiece -->
    <ellipse cx="400" cy="140" rx="35" ry="12" fill="#ffffff" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="400" cy="140" rx="22" ry="8" fill="#111"/>

    <!-- Long Neck Tube -->
    <rect x="375" y="145" width="50" height="280" fill="url(#bongBody)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Ice Notches / Perc Chambers -->
    <circle cx="385" cy="280" r="8" fill="#fff" opacity="0.5"/>
    <circle cx="415" cy="280" r="8" fill="#fff" opacity="0.5"/>
    <circle cx="400" cy="340" r="16" fill="#99e2b4" stroke="#fff" stroke-width="1" opacity="0.7"/>

    <!-- Main Water Beaker / Bubble Chamber -->
    <path d="M 375 425 L 300 620 Q 280 670 330 670 L 470 670 Q 520 670 500 620 L 425 425 Z" fill="url(#bongBody)" stroke="#ffffff" stroke-width="3"/>

    <!-- Water Line -->
    <path d="M 320 610 Q 400 625 480 610" stroke="#00ffff" stroke-width="4" fill="none" opacity="0.6"/>

    <!-- Downstem & Slide Bowl -->
    <line x1="450" y1="480" x2="380" y2="630" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M 450 480 L 490 440 L 515 455 L 475 495 Z" fill="#99e2b4" stroke="#fff" stroke-width="2"/>
    <!-- Bowl -->
    <ellipse cx="505" cy="445" rx="18" ry="12" fill="#555" stroke="#fff" stroke-width="1"/>
  </g>
</svg>