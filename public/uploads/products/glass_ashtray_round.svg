<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="ashtrayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <filter id="trayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#080808"/>
  <circle cx="400" cy="400" r="360" fill="url(#ashtrayGlow)"/>

  <text x="400" y="90" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="900" fill="#E5C158" text-anchor="middle" letter-spacing="3">HEAVY CUT CRYSTAL ROUND ASHTRAY</text>
  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A89050" text-anchor="middle" letter-spacing="2">HEAVY CUT CRYSTAL GLASS</text>

  <!-- Ashtray Isometric Shape -->
  <g filter="url(#trayShadow)" transform="translate(0, 40)">
    <!-- Outer Rim -->
    <ellipse cx="400" cy="420" rx="260" ry="160" fill="#333333" stroke="#E0E0E0" stroke-width="4"/>
    
    <!-- Inner Bowl -->
    <ellipse cx="400" cy="420" rx="190" ry="110" fill="#151515" stroke="#E0E0E0" stroke-width="2"/>
    
    
      <!-- Crystal Cut Facet Pattern -->
      <line x1="210" y1="420" x2="350" y2="420" stroke="#fff" stroke-width="3" opacity="0.6"/>
      <line x1="450" y1="420" x2="590" y2="420" stroke="#fff" stroke-width="3" opacity="0.6"/>
      <line x1="400" y1="310" x2="400" y2="380" stroke="#fff" stroke-width="3" opacity="0.6"/>
      <line x1="400" y1="460" x2="400" y2="530" stroke="#fff" stroke-width="3" opacity="0.6"/>
    

    <!-- Cigarette / Cigar Rests -->
    <rect x="135" y="412" width="40" height="16" rx="6" fill="#111" stroke="#E0E0E0" stroke-width="2"/>
    <rect x="625" y="412" width="40" height="16" rx="6" fill="#111" stroke="#E0E0E0" stroke-width="2"/>
    <rect x="392" y="255" width="16" height="40" rx="6" fill="#111" stroke="#E0E0E0" stroke-width="2"/>
    <rect x="392" y="545" width="16" height="40" rx="6" fill="#111" stroke="#E0E0E0" stroke-width="2"/>
  </g>
</svg>